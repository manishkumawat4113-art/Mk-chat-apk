name: Build MK Chat APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Create package.json if needed
        run: |
          if [ ! -f package.json ]; then
            npm init -y
          fi

      - name: Initialize Capacitor
        run: |
          npx cap init "MK Chat" "com.mkchat.app" --web-dir www

      - name: Add Android platform
        run: |
          npx cap add android

      - name: Sync web files
        run: |
          npx cap sync android

      - name: Install Pillow
        run: |
          pip install Pillow

      - name: Set MK Chat Android Icon
        run: |
          python3 - <<'PY'
          from PIL import Image
          import os

          src = "assets/icon-only.png"

          if not os.path.exists(src):
              raise SystemExit("icon-only.png not found")

          img = Image.open(src).convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          base = "android/app/src/main/res"

          for density, size in sizes.items():
              folder = os.path.join(base, f"mipmap-{density}")
              os.makedirs(folder, exist_ok=True)

              output = os.path.join(folder, "ic_launcher.png")
              img.resize((size, size), Image.Resampling.LANCZOS).save(output)

              output_round = os.path.join(folder, "ic_launcher_round.png")
              img.resize((size, size), Image.Resampling.LANCZOS).save(output_round)

          print("MK Chat icon installed successfully.")
          PY
            - name: Force MK Chat launcher icon
        run: |
          python3 - <<'PY'
          import os
          import re

          res = "android/app/src/main/res"

          # Remove default Capacitor adaptive launcher icons
          adaptive_dirs = [
              "mipmap-anydpi-v26",
              "mipmap-anydpi-v27",
              "mipmap-anydpi-v31",
              "mipmap-anydpi-v33"
          ]

          for directory in adaptive_dirs:
              path = os.path.join(res, directory)

              if os.path.isdir(path):
                  for filename in [
                      "ic_launcher.xml",
                      "ic_launcher_round.xml"
                  ]:
                      file_path = os.path.join(path, filename)

                      if os.path.exists(file_path):
                          os.remove(file_path)
                          print("Removed:", file_path)

          # Force AndroidManifest to use our PNG launcher icons
          manifest = "android/app/src/main/AndroidManifest.xml"

          with open(manifest, "r", encoding="utf-8") as f:
              data = f.read()

          data = re.sub(
              r'android:icon="[^"]*"',
              'android:icon="@mipmap/ic_launcher"',
              data,
              count=1
          )

          data = re.sub(
              r'android:roundIcon="[^"]*"',
              'android:roundIcon="@mipmap/ic_launcher_round"',
              data,
              count=1
          )

          with open(manifest, "w", encoding="utf-8") as f:
              f.write(data)

          print("MK Chat PNG launcher icon forced successfully.")
          PY
      - name: Fix Kotlin duplicate dependencies
        working-directory: android
        run: |
          echo "" >> app/build.gradle
          echo "configurations.all {" >> app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'" >> app/build.gradle
          echo "    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'" >> app/build.gradle
          echo "}" >> app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MK-Chat-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
